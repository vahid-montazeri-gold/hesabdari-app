<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>حساب خرید کارت‌ها</title>

 <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d4af37">
<meta name="apple-mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css">

<script src="https://cdn.jsdelivr.net/npm/jquery/dist/jquery.min.js">function backupData() {

 const data = {};

 for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        data[key] = localStorage.getItem(key);
    }

    const blob = new Blob(
        [JSON.stringify(data, null, 2)],
        { type: "application/json" }
    );

    const a = document.createElement("a");

    a.href = URL.createObjectURL(blob);

    const today = new Date().toISOString().slice(0,10);

    a.download = "hesabdari_backup_" + today + ".json";

    a.click();

    URL.revokeObjectURL(a.href);

}

 function restoreData(){

    const input = document.getElementById("restoreFile");

    input.onchange = function(e){

        const file = e.target.files[0];

        if(!file) return;

        const reader = new FileReader();

        reader.onload = function(){

            const data = JSON.parse(reader.result);

            for(const key in data){

                localStorage.setItem(key,data[key]);

            }

            alert("اطلاعات با موفقیت بازیابی شد.\nلطفاً یک بار برنامه را ببندید و دوباره باز کنید.");

        };

        reader.readAsText(file);

    };

    input.click();

}


</script>

     
 <script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js');
  });
}
</script>
 
</body>

</html>
