<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>حساب خرید کارت‌ها</title>

 <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d4af37">
<meta name="apple-mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css">

<script src="https://cdn.jsdelivr.net/npm/jquery/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/persian-date/dist/persian-date.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script>

<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Vazirmatn,sans-serif;
}

body{
background:#111;
color:#fff;
padding:15px;
}

.container{
max-width:700px;
margin:auto;
}

h1{
text-align:center;
color:#d4af37;
margin-bottom:20px;
}

.card{
background:#1b1b1b;
border:2px solid #d4af37;
border-radius:12px;
padding:15px;
margin-bottom:15px;
}

.card h2{
color:#d4af37;
font-size:18px;
margin-bottom:12px;
}

label{
display:block;
margin-top:10px;
margin-bottom:5px;
}

input,select{

width:100%;
padding:10px;
border:none;
border-radius:8px;
font-size:15px;
}

button{

width:100%;
padding:12px;
background:#d4af37;
color:#111;
font-size:16px;
font-weight:bold;
border:none;
border-radius:8px;
cursor:pointer;
margin-top:15px;

}

button:hover{

opacity:.9;

}

.dashboard{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;

}

.box{

background:#222;
border:1px solid #d4af37;
padding:10px;
border-radius:10px;
text-align:center;

}

.box span{

display:block;
margin-top:8px;
font-size:20px;
color:#d4af37;

}

table{

width:100%;
border-collapse:collapse;
margin-top:10px;

}

th{

background:#d4af37;
color:#111;
padding:10px;

}

td{

border:1px solid #555;
padding:8px;
text-align:center;

}

.actionBtn{

width:auto;
padding:5px 10px;
margin:2px;

}

.red{

background:#c62828;
color:#fff;

}

.green{

background:#2e7d32;
color:#fff;

}

@media(max-width:600px){

.dashboard{

grid-template-columns:1fr;

}

table{

font-size:12px;

}

}

</style>

</head>

<body>

<div class="container">

<h1>حساب خرید کارت‌ها</h1>

<div class="card">

<h2>موجودی کارت‌ها</h2>

<label>کارت صادرات</label>
<input type="number" id="card1">

<label>کارت رفاه</label>
<input type="number" id="card2">

<label>کارت ملت</label>
<input type="number" id="card3">

<div style="display:flex;gap:10px;margin-top:15px;">

<button style="flex:1" onclick="saveBalance()">
ذخیره موجودی
</button>

<button style="flex:1;background:#1976d2;color:#fff"
onclick="editBalance()">
ویرایش موجودی
</button>

</div>

</div>

<div class="card">

<h2>داشبورد</h2>

<div class="dashboard">

<div class="box">
موجودی کل
<span id="totalBalance">0</span>
</div>

<div class="box">
 کارت صادرات   
<span id="showCard1">0</span>
</div>

<div class="box">
کارت رفاه
<span id="showCard2">0</span>
</div>

<div class="box">
کارت ملت
<span id="showCard3">0</span>
</div>

<div class="box">
تعداد خرید
<span id="buyCount">0</span>
</div>

<div class="box">
جمع خرید
<span id="buyTotal">0</span>
</div>

</div>

</div>

<div class="card">

<h2>ثبت خرید</h2>

<label>تاریخ</label>
<input type="text" id="buyDate" placeholder="۱۴۰۵/۰۴/۲۸">

<label>نام کالا</label>
<input type="text" id="itemName" placeholder="مثلاً برنج">

<label>مبلغ خرید</label>
<input type="number" id="itemPrice" placeholder="مبلغ">

<label>کارت پرداخت</label>
<select id="buyCard">

<option value="1">کارت صادرات</option>
<option value="2">کارت رفاه</option>
<option value="3">کارت ملت</option>

</select>

<button onclick="addBuy()">ثبت خرید</button>

</div>

<div class="card">

<h2>لیست خریدها</h2>

<table>

<thead>

<tr>

<th>تاریخ</th>
<th>کالا</th>
<th>مبلغ</th>
<th>کارت</th>
<th>حذف</th>

</tr>

</thead>

<tbody id="buyTable">

</tbody>

</table>

</div>

<div class="card">

<h2>گزارش خرید به تفکیک کالا</h2>

<table>

<thead>

<tr>

<th>کالا</th>
<th>تعداد</th>
<th>جمع مبلغ</th>

</tr>

</thead>

<tbody id="reportTable">

</tbody>

</table>

</div>

<script>

let balances={
card1:0,
card2:0,
card3:0
};

let buys=[];

if(localStorage.getItem("balances")){
balances=JSON.parse(localStorage.getItem("balances"));
}

if(localStorage.getItem("buys")){
buys=JSON.parse(localStorage.getItem("buys"));
}

document.getElementById("card1").value=balances.card1;
document.getElementById("card2").value=balances.card2;
document.getElementById("card3").value=balances.card3;

if(
balances.card1!=0 ||
balances.card2!=0 ||
balances.card3!=0
){

lockBalance();

}

showDashboard();
showBuys();
showReport();

function lockBalance(){

document.getElementById("card1").disabled=true;

document.getElementById("card2").disabled=true;

document.getElementById("card3").disabled=true;

}

function editBalance(){

document.getElementById("card1").disabled=false;

document.getElementById("card2").disabled=false;

document.getElementById("card3").disabled=false;

}

function lockBalance(){

document.getElementById("card1").disabled=true;
document.getElementById("card2").disabled=true;
document.getElementById("card3").disabled=true;

}

function editBalance(){

document.getElementById("card1").disabled=false;
document.getElementById("card2").disabled=false;
document.getElementById("card3").disabled=false;

}

function saveBalance(){

balances.card1=Number(document.getElementById("card1").value);

balances.card2=Number(document.getElementById("card2").value);

balances.card3=Number(document.getElementById("card3").value);

localStorage.setItem("balances",JSON.stringify(balances));

showDashboard();

lockBalance();

alert("ذخیره شد");

}

function showDashboard(){

document.getElementById("showCard1").innerHTML=
balances.card1.toLocaleString("fa-IR");

document.getElementById("showCard2").innerHTML=
balances.card2.toLocaleString("fa-IR");

document.getElementById("showCard3").innerHTML=
balances.card3.toLocaleString("fa-IR");

let total=
balances.card1+
balances.card2+
balances.card3;

document.getElementById("totalBalance").innerHTML=
total.toLocaleString("fa-IR");

let sum=0;

buys.forEach(function(b){

sum+=Number(b.price);

});

document.getElementById("buyTotal").innerHTML=
sum.toLocaleString("fa-IR");

document.getElementById("buyCount").innerHTML=
buys.length;

}

function addBuy(){

let date=document.getElementById("buyDate").value;

let item=document.getElementById("itemName").value.trim();

let price=Number(document.getElementById("itemPrice").value);

let card=document.getElementById("buyCard").value;

if(date=="" || item=="" || price<=0){

alert("اطلاعات را کامل وارد کنید");

return;

}

if(card=="1"){

if(price>balances.card1){

alert("موجودی کارت صادرات کافی نیست");

return;

}

balances.card1-=price;

}

if(card=="2"){

if(price>balances.card2){

alert("موجودی کارت رفاه کافی نیست");

return;

}

balances.card2-=price;

}

if(card=="3"){

if(price>balances.card3){

alert("موجودی کارت ملت کافی نیست");

return;

}

balances.card3-=price;

}

buys.push({

date:date,

item:item,

price:price,

card:card

});

localStorage.setItem("balances",JSON.stringify(balances));

localStorage.setItem("buys",JSON.stringify(buys));

document.getElementById("itemName").value="";

document.getElementById("itemPrice").value="";

showDashboard();

showBuys();

showReport();

}

function showBuys(){

let table=document.getElementById("buyTable");

table.innerHTML="";

let sorted=[...buys];

sorted.sort(function(a,b){

return a.date.localeCompare(b.date);

});

sorted.forEach(function(b){

let realIndex=buys.indexOf(b);

let cardName="";

if(b.card=="1") cardName="کارت صادرات";
if(b.card=="2") cardName="کارت رفاه";
if(b.card=="3") cardName="کارت ملت";

table.innerHTML+=`

<tr>

<td>${b.date}</td>

<td>${b.item}</td>

<td>${Number(b.price).toLocaleString('fa-IR')}</td>

<td>${cardName}</td>

<td>

<button class="actionBtn green"
onclick="editBuy(${realIndex})">

✏️

</button>

<button class="actionBtn red"
onclick="deleteBuy(${realIndex})">

🗑

</button>

</td>

</tr>

`;

});

}

function deleteBuy(index){

if(!confirm("این خرید حذف شود؟")) return;

let b=buys[index];

if(b.card=="1") balances.card1+=Number(b.price);

if(b.card=="2") balances.card2+=Number(b.price);

if(b.card=="3") balances.card3+=Number(b.price);

buys.splice(index,1);

localStorage.setItem("balances",JSON.stringify(balances));

localStorage.setItem("buys",JSON.stringify(buys));

showDashboard();

showBuys();

showReport();

}

function editBuy(index){

let b=buys[index];

document.getElementById("buyDate").value=b.date;

document.getElementById("itemName").value=b.item;

document.getElementById("itemPrice").value=b.price;

document.getElementById("buyCard").value=b.card;

/* برگرداندن مبلغ خرید قبلی به کارت */

if(b.card=="1") balances.card1+=Number(b.price);

if(b.card=="2") balances.card2+=Number(b.price);

if(b.card=="3") balances.card3+=Number(b.price);

/* حذف خرید از لیست */

buys.splice(index,1);

localStorage.setItem("balances",JSON.stringify(balances));

localStorage.setItem("buys",JSON.stringify(buys));

showDashboard();

showBuys();

showReport();

window.scrollTo({

top:0,

behavior:"smooth"

});

}

function showReport(){

let result={};

buys.forEach(function(b){

if(!result[b.item]){

result[b.item]={

count:0,

sum:0

};

}

result[b.item].count++;

result[b.item].sum+=Number(b.price);

});

let table=document.getElementById("reportTable");

table.innerHTML="";

for(let item in result){

table.innerHTML+=`

<tr>

<td>${item}</td>

<td>${result[item].count}</td>

<td>${result[item].sum.toLocaleString('fa-IR')}</td>

</tr>

`;

}

}

</script>

</div>

 <script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js');
  });
}
</script>
 
</body>

</html>
